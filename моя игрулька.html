  d.innerHTML=`<p></p><div class="meta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12S5 5 12 5s11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><span>${v>999?(v/1e3).toFixed(1)+'K':v}</span><span>${new Date().toLocaleTimeString(lang==='en'?'en-GB':lang==='ru'?'ru-RU':'uk-UA',{hour:'2-digit',minute:'2-digit'})}</span></div>`;
  d.firstChild.innerHTML=tr(k,...a);posts.push({el:d,k,a});feed.appendChild(d);
  while(feed.children.length>60){feed.firstChild.remove();posts.shift();}feed.scrollTop=feed.scrollHeight;beep();}
let toastT;function toast(m,t){const e=$('toast');e.textContent=m;e.dataset.t=t||'err';e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2800);}
// состояние и сохранение
let threats=[],falling=[],kills=0,hits=0,spent=0,spentPatriots=0,pending=0,gen=0,active=false,yellow=false,killQ=[],hitQ=[],placing=false,placeKind=null,customPatriots=[],inv={radar:0,patriot:0,s300:0,pickup:0};window.spentPickups=0;
const KEY='osint_radar_v2';
function saveGameState(){try{localStorage.setItem(KEY,JSON.stringify({statDown:kills,statHit:hits,spent,spentPatriots,inv,customPatriots}));}catch(e){}}
function loadGameState(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(!s)return;
  kills=s.statDown|0;hits=s.statHit|0;spent=s.spent|0;Object.assign(inv,s.inv||{});
  customPatriots=(Array.isArray(s.customPatriots)?s.customPatriots:[]).filter(c=>c&&c.k&&c.p&&KIND[c.k]&&c.k!=='base');customPatriots.forEach(c=>mkSite(c.k,c.p));
  spentPatriots=customPatriots.filter(c=>c.k==='patriot').length;window.spentPickups=customPatriots.filter(c=>c.k==='pickup').length;
  tg('loaded');}catch(e){}}
// угрозы
const tgt=()=>{const d=+$('dest').value,i=d>=0?d:Math.random()*C.length|0,c=C[i];return[c.lat+rnd(-.05,.05),c.lon+rnd(-.07,.07),i];};
function spawn(type,p,t,home){const c=T[type],th={type,p:[...p],b:[...p],ph:rnd(0,6.28),amp:(Math.random()<.5?-1:1)*rnd(.008,.025),t,home,d0:km(p,t),vis:new Set(),cv:new Set(),launched:false,dead:false}; // амплитуда виляния уменьшена
  th.m=L.marker(th.p,{pane:'air',interactive:true,keyboard:false,icon:icon(`<div class="t" style="--c:${c.c}">${svg(c.s,c.c,22)}</div>`,24)}).addTo(map);
  th.m.on('click',()=>{const r=km(th.p,th.t),h=r/c.kmh*60;tg('info',type,th.t[2],c.kmh,Math.round(r),h<1?'<1':Math.round(h));});
  th.line=L.polyline([th.p,t],{pane:'air',color:c.c,weight:1,opacity:.4,dashArray:'3 6',interactive:false}).addTo(map);
  th.el=th.m.getElement().querySelector('svg');th.h=1e3;turn(th);threats.push(th);return th;}
function kill(th){th.dead=true;map.removeLayer(th.m);map.removeLayer(th.line);}
function boom(p,c='#fb923c',z=34){const m=L.marker(p,{pane:'air',interactive:false,keyboard:false,icon:icon(`<div class="boom">${svg('boom',c,z)}</div>`,z+2)}).addTo(map);setTimeout(()=>map.removeLayer(m),1000);}
// сбитие: БПЛА уходит в штопор на 1.5 с, остальные взрываются сразу
function shootDown(th){
  if(T[th.type].s==='shahed'){th.dead=true;map.removeLayer(th.line);falling.push({th,t0:performance.now()});}
  else{boom(th.p);kill(th);}}
function animateFalling(now){
  for(let i=falling.length-1;i>=0;i--){const f=falling[i],th=f.th,u=Math.min(1,(now-f.t0)/1500),hr=th.h*Math.PI/180,w=th.m.getElement()&&th.m.getElement().firstChild;
    if(th.el)th.el.style.transform=`rotate(${th.h+u*1800}deg)`; // штопор: 5 оборотов
    if(w){w.style.transform=`translate(${Math.sin(hr)*22*u}px,${-Math.cos(hr)*22*u+44*u*u}px) scale(${1-.45*u})`;w.style.opacity=1-u;} // инерция вперёд + падение вниз
    if(u>=1){boom(th.p,'#fb923c',26);map.removeLayer(th.m);falling.splice(i,1);}}}
function arrive(th){
  if(th.type==='air'){if(!th.launched){th.launched=true;spawn(Math.random()<.5?'cruise':'onyx',th.p,tgt());th.t=th.home;}else kill(th);return;}
  if(th.type==='tu160'){kill(th);return;}
  boom(th.t,'#f43f5e',46);hits++;hitQ.push(th.t[2]);saveGameState();
  const k=regionOf(th.t);if(k>=0&&$('fx').checked)flash[k]=performance.now()+1500;
  kill(th);}
function regions(){
  const red=new Set(),now=performance.now(),hot=new Set();
  for(const th of threats){if(th.dead||T[th.type].plane)continue;const r=regionOf(th.p);if(r>=0)th.vis.add(r);th.vis.forEach(i=>red.add(i));
    C.forEach((c,i)=>{if(km(th.p,[c.lat,c.lon])<c.r*111)th.cv.add(i);});th.cv.forEach(i=>hot.add(i));}
  const y=threats.some(t=>!t.dead&&T[t.type].plane);
  if(y!==yellow){yellow=y;if(y)tg('yellow');}
  R.forEach((r,i)=>{const s=flash[i]>now?'boom':red.has(i)?'red':lib[i]?'green':yellow?'yellow':'none';if(s!==st[i]){st[i]=s;polys[i].setStyle(sty(s));}});
  C.forEach((c,i)=>{const on=hot.has(i);if(on===c.on)return;c.on=on;c.el.classList.toggle('alert',on);if(on)tg('alert',i);});
}
// цикл перехвата: трассеры + логика РЛС для Patriot
const HEAT_STEP=0.01,HEAT_MAX=0.6; // +заливка за тик (150 мс) → до 0.6
function zones(){for(const s of sites){if(s.kind!=='base'&&s.kind!=='city')continue;
  const hot=threats.some(th=>!th.dead&&!T[th.type].plane&&km(s.p,th.p)<s.r); // в секторе города есть угроза
  if(hot){if(s.heat<HEAT_MAX){s.heat=Math.min(HEAT_MAX,s.heat+HEAT_STEP);s.circ.setStyle({color:'#7f1d1d',fill:true,fillOpacity:s.heat});}} // чем дольше тревога, тем темнее
  else if(s.heat>.05){s.heat=.05;s.circ.setStyle({color:KIND[s.kind].col,fill:true,fillOpacity:.05});}} // небо чисто — сброс на зелёный
  }
function pvo(now){pvoStations.forEach(s=>{
  if(s.type==='city')return; // районные города — без ППО
  const K=KIND[s.kind];if(K.noFire)return; // РЛС сама не стреляет
  if(K.needRadar){const ok=sites.some(x=>x.kind==='radar'&&km(x.p,s.p)<RADAR_KM); // нужна РЛС ближе 1.5°
    if(ok!==s.on){s.on=ok;s.circ.setStyle({opacity:ok?.95:.3});}if(!ok)return;}
  if(now<s.cd)return;let b=null,bd=s.r;
  for(const th of threats){if(th.dead||(s.only&&!s.only.includes(th.type)))continue;const d=km(s.p,th.p);if(d<bd){b=th;bd=d;}}
  if(!b)return;s.cd=now+2200;
  const ln=L.polyline([s.p,b.p],{pane:'pvo',color:s.tr,weight:1.5,opacity:1,interactive:false}).addTo(map);setTimeout(()=>map.removeLayer(ln),150);
  if(Math.random()<(s.ch||T[b.type].ch)){kills++;killQ.push(near(b.p));saveGameState();shootDown(b);}});}
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;acc+=dt;
  const tc=now/150;
  for(const th of threats){if(th.dead)continue;
    const g=th.t,dx=(g[1]-th.b[1])*74,dy=(g[0]-th.b[0])*111,d=Math.hypot(dx,dy),dd=d/111;
    if(th.type==='tu160'&&!th.launched&&dd<2.5){th.launched=true;
      for(let i=0;i<4;i++)spawn('cruise',th.p,[th.t[0]+rnd(-.05,.05),th.t[1]+rnd(-.07,.07),th.t[2]]);
      th.t=th.home;tg('tu160r');continue;}
    const s=T[th.type].v*dt;
    if(s>=d){arrive(th);continue;}
    th.b[0]+=dy/d*s/111;th.b[1]+=dx/d*s/74;
    const f=Math.min(1,dd/.3)*Math.max(0,Math.min(1,(4.5-dd)/.5));
    const off=Math.sin(tc*.1+th.ph)*th.amp*f*111;
    const ox=th.p[1],oy=th.p[0];th.p[0]=th.b[0]+dx/d*off/111;th.p[1]=th.b[1]-dy/d*off/74;
    turn(th,brg((th.p[1]-ox)*74,(th.p[0]-oy)*111));
    th.m.setLatLng(th.p);th.line.setLatLngs([th.p,th.t]);}
  animateFalling(now);
  if(acc>.15){acc=0;threats=threats.filter(t=>!t.dead);pvo(now);zones();regions();threats=threats.filter(t=>!t.dead);
    $('nAir').textContent=threats.length;$('nKill').textContent=kills;$('nHit').textContent=hits;$('nPts').textContent=kills-spent;$('dpts').textContent=kills-spent;
    if(drawerOpen)updArm();
    if(musicOn&&!pending&&!threats.length)stopBuckshotMusic();
    if(active&&!pending&&!threats.some(t=>!T[t.type].plane)){active=false;tg('clear');}}
  requestAnimationFrame(frame);
}
setInterval(()=>{
  if(killQ.length){const m={};killQ.forEach(i=>m[i]=(m[i]||0)+1);Object.entries(m).slice(0,3).forEach(([i,n])=>tg('kill',n,+i));killQ=[];}
  if(hitQ.length){const m={};hitQ.forEach(i=>m[i]=(m[i]||0)+1);tg('hit',Object.keys(m).map(Number));Object.entries(m).forEach(([i,n])=>{if(n>=2)tg('blackout',+i);});hitQ=[];}},2000);
// панель налёта (вкладка в выдвижной панели)
const ROWS=Object.keys(T),inp={},rowEl={};
const tnm=k=>k==='kalibr'?tr('kalibrN'):T[k].n;
ROWS.forEach(k=>{const c=T[k],d=document.createElement('div');d.className='row';d.style.setProperty('--c',c.c);
  d.innerHTML=`<span></span><b>${c.df||0}</b><input type="range" min="0" max="${c.mx}" value="${c.df||0}">`;
  const e=d.querySelector('input');inp[k]=e;rowEl[k]=d;e.oninput=()=>{d.querySelector('b').textContent=e.value;upd();};$('rows').appendChild(d);});
function upd(){$('tot').textContent=ROWS.reduce((a,k)=>a+ +inp[k].value,0);}
$('go').onclick=()=>{
  const gs=[];ROWS.forEach(k=>{const n=+inp[k].value;if(!n)return;
    if(k==='air'||k==='tu160'||k==='kalibr'){gs.push({k,n,d:-1});return;}
    const ds=[0,1,2].sort(()=>Math.random()-.5);
    if(n>=4&&Math.random()<.5){const a=1+(Math.random()*(n-1)|0);gs.push({k,n:a,d:ds[0]},{k,n:n-a,d:ds[1]});}else gs.push({k,n,d:ds[0]});});
  const total=gs.reduce((a,g)=>a+g.n,0);if(!total)return;
  if(total>=25)startBuckshotMusic();
  active=true;const G=gen,step=Math.min(500,9000/total),dv=+$('dest').value;let i=0;
  gs.sort(()=>Math.random()-.5).forEach(g=>{
    setTimeout(()=>{if(G!==gen)return;
      if(g.k==='air')tg('air',g.n);else if(g.k==='tu160')tg('tu160',g.n);else if(g.k==='kalibr')tg('kalibr',g.n,dv);
      else if(g.k==='shahed'||g.k==='jet')tg('shahedL',g.n,g.d);else tg('missL',g.k,g.n,g.d);},i*step);
    for(let j=0;j<g.n;j++){pending++;setTimeout(()=>{pending--;if(G!==gen)return;
      if(g.k==='air'){const p=[rnd(44.5,48),50];spawn('air',p,[rnd(48,51),39.5],p);}
      else if(g.k==='tu160'){const p=pick([DIRS[0],DIRS[2]])();spawn('tu160',p,tgt(),p);}
      else if(g.k==='kalibr')spawn('kalibr',[...ship.p],tgt()); // со ссылкой на текущие координаты корабля
      else spawn(g.k,DIRS[g.d](),tgt());},i++*step+rnd(0,step*2));}});
  if(gs.filter(g=>g.k==='shahed'||g.k==='jet').reduce((a,g)=>a+g.n,0)>=10)setTimeout(()=>{if(G===gen)tg('decoy');},total*step*.5+1500);
  closeDrawer();};
// карточки вооружения
const CARDS=[['radar',89,1.5,0,'radarN','radarD','#a78bfa'],['patriot',200,.9,10,'patN','patD','#3b82f6'],['s300',499,1,0,'s3N','s3D','#f97316'],['pickup',40,.35,3,'pkN','pkD','#eab308']];
const onMap=k=>sites.filter(s=>s.kind===k).length;
function buildCards(){$('cards').innerHTML=CARDS.map(c=>`<div class="card" style="--c:${c[6]}"><h4>${tr(c[4])}</h4><p>${tr(c[5])}</p><div class="cm">${tr('range')}: ${c[2]}° · ${tr('limit')}: ${c[3]||tr('noLimit')}</div><div class="cp">${c[1]} ${tr('pts')}</div><div class="cs" id="cs-${c[0]}"></div><div class="cb"><button data-a="buy" data-k="${c[0]}" id="bb-${c[0]}">${tr('buy')}</button><button data-a="pl" data-k="${c[0]}" id="bp-${c[0]}">${tr('place')}</button></div></div>`).join('');updArm();}
function updArm(){CARDS.forEach(c=>{const k=c[0],e=$('cs-'+k);if(!e)return;const m=onMap(k);
  e.textContent=`${tr('stock')}: ${inv[k]} · ${tr('onMap')}: ${m}${c[3]?'/'+c[3]:''}`;
  $('bb-'+k).disabled=kills-spent<c[1]||(c[3]&&inv[k]+m>=c[3]);$('bp-'+k).disabled=inv[k]<=0;});$('dpts').textContent=kills-spent;}
function buy(k){const c=CARDS.find(x=>x[0]===k);
  if(kills-spent<c[1]){toast(tr('errPts'));return;}
  if(c[3]&&inv[k]+onMap(k)>=c[3]){toast(tr('errLim'));return;}
  spent+=c[1];inv[k]++;saveGameState();updArm();}
$('cards').onclick=e=>{const b=e.target.closest('button[data-a]');if(!b||b.disabled)return;
  if(b.dataset.a==='buy')buy(b.dataset.k);else{if(inv[b.dataset.k]<=0)return;placeKind=b.dataset.k;placing=true;map.getContainer().style.cursor='crosshair';closeDrawer();toast(tr('placeHint'),'ok');}};
// гео-валидатор: ставить можно только на суше Украины (внутри полигонов областей)
map.on('click',e=>{if(!placing||!placeKind)return;const k=placeKind,p=[e.latlng.lat,e.latlng.lng];
  if(regionOf(p)<0){toast(tr('errGeo'));return;} // остаёмся в режиме установки
  placing=false;placeKind=null;map.getContainer().style.cursor='';
  const c=CARDS.find(x=>x[0]===k);if(inv[k]<=0||(c[3]&&onMap(k)>=c[3]))return;
  inv[k]--;if(k==='patriot')spentPatriots++;if(k==='pickup')window.spentPickups++;
  customPatriots.push({k,p});mkSite(k,p);saveGameState();updArm();});
// выдвижная панель, настройки
let drawerOpen=false;
function showTab(t){$('viewArm').hidden=t!=='arm';$('viewRaid').hidden=t!=='raid';$('tabArm').classList.toggle('on',t==='arm');$('tabRaid').classList.toggle('on',t==='raid');}
function openDrawer(t){drawerOpen=true;$('drawer').classList.add('open');document.body.classList.add('dopen');showTab(t);updArm();}
function closeDrawer(){drawerOpen=false;$('drawer').classList.remove('open');document.body.classList.remove('dopen');}
$('bArm').onclick=()=>openDrawer('arm');$('bRaid').onclick=()=>openDrawer('raid');$('tabArm').onclick=()=>showTab('arm');$('tabRaid').onclick=()=>showTab('raid');$('dhide').onclick=closeDrawer;
$('bSet').onclick=()=>$('settings').classList.add('on');$('setx').onclick=()=>$('settings').classList.remove('on');
$('settings').onclick=e=>{if(e.target.id==='settings')$('settings').classList.remove('on');};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){placing=false;placeKind=null;map.getContainer().style.cursor='';closeDrawer();$('settings').classList.remove('on');}});
// язык
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));
  const cur=$('dest').value||'-1';$('dest').innerHTML=`<option value="-1">${tr('rnd')}</option>`+C.map((c,i)=>`<option value="${i}">${cn(i)}</option>`).join('');$('dest').value=cur;
  ROWS.forEach(k=>{rowEl[k].querySelector('span').innerHTML=`${ic(k)}${tnm(k)} (0–${T[k].mx})`;});
  C.forEach((c,i)=>{c.el.querySelector('span').textContent=cn(i);});
  ship.el.querySelector('span').textContent=tr('ship');
  setLibText();buildCards();
  posts.forEach(p=>{p.el.firstChild.innerHTML=tr(p.k,...p.a);});
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));}
function setLang(l){lang=l;try{localStorage.setItem('lang',l);}catch(e){}applyLang();}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
const setLibText=()=>{$('lib').textContent=tr('lib')+': '+tr(libMode?'on':'off');};
$('lib').onclick=function(){libMode=!libMode;this.classList.toggle('on',libMode);setLibText();};
// тема: класс light-theme + смена тайлов карты
function syncTheme(){dark=!document.body.classList.contains('light-theme');$('th').checked=dark;
  polys.forEach((p,i)=>p.setStyle(sty(st[i])));outl.setStyle({color:dark?'#aab3c5':'#6f6858'});setGrid();}
function toggleTheme(){document.body.classList.toggle('light-theme');
  try{localStorage.setItem('theme',document.body.classList.contains('light-theme')?'light':'dark');}catch(e){}
  syncTheme();}
$('th').onchange=toggleTheme;
$('snd').onchange=e=>{if(!e.target.checked)stopBuckshotMusic();};
$('reset').onclick=()=>{gen++;pending=0;active=false;stopBuckshotMusic();threats.forEach(t=>{if(!t.dead)kill(t);});threats=[];falling.forEach(f=>map.removeLayer(f.th.m));falling.length=0;};
$('vol').oninput=e=>{bg.volume=+e.target.value;};
$('go').addEventListener('click',unlockAudio);$('bRaid').addEventListener('click',unlockAudio);map.once('click',unlockAudio);
try{if(localStorage.getItem('theme')==='light')document.body.classList.add('light-theme');}catch(e){}
syncTheme();applyLang();upd();
tg('start');loadGameState();updArm();
requestAnimationFrame(frame);

</script>
