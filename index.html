<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Тактическая Карта-Песочница</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
/* Layout: карта на весь экран; поверх неё один слой интерфейса: инструменты и параметры сверху, зум справа, режим карты и действия снизу. */
:root {
  --bg: #0b0c0a;
  --panel: rgba(6, 7, 5, 0.74);
  --line: rgba(156, 160, 112, 0.26);
  --khaki: #9a9e6a;
  --olive: #3f4429;
  --text: #d8dacf;
  --muted: #8d9183;
  --blue: #1d4ed8;
  --red: #b91c1c;
  --gray: #4b5563;
  --white: #e5e7eb;
  --display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; }
button, input { font-family: inherit; }
 
/* ---------- Leaflet: необходимый минимум ---------- */
.leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow, .leaflet-tile-container,
.leaflet-pane > svg, .leaflet-pane > canvas, .leaflet-zoom-box, .leaflet-image-layer, .leaflet-layer { position: absolute; left: 0; top: 0; }
.leaflet-container { overflow: hidden; background: #0b0c0a; touch-action: none; -webkit-tap-highlight-color: transparent; outline: 0; font-family: var(--mono); }
.leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow { -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
.leaflet-tile::selection { background: transparent; }
.leaflet-marker-icon, .leaflet-marker-shadow { display: block; }
.leaflet-container .leaflet-pane svg { max-width: none !important; max-height: none !important; }
.leaflet-container .leaflet-marker-pane img, .leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img, .leaflet-container img.leaflet-image-layer, .leaflet-container .leaflet-tile {
  max-width: none !important; max-height: none !important; width: auto; padding: 0;
}
.leaflet-pane { z-index: 400; }
.leaflet-tile-pane { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane { z-index: 500; }
.leaflet-marker-pane { z-index: 600; }
.leaflet-tooltip-pane { z-index: 650; }
.leaflet-popup-pane { z-index: 700; }
.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg { z-index: 200; }
.leaflet-tile { visibility: hidden; }
.leaflet-tile-loaded { visibility: inherit; }
.leaflet-zoom-animated { transform-origin: 0 0; }
svg.leaflet-zoom-animated { will-change: transform; }
.leaflet-zoom-anim .leaflet-zoom-animated { transition: transform 0.25s cubic-bezier(0, 0, 0.25, 1); }
.leaflet-zoom-anim .leaflet-tile, .leaflet-pan-anim .leaflet-tile { transition: none; }
.leaflet-zoom-anim .leaflet-zoom-hide { visibility: hidden; }
.leaflet-interactive { cursor: pointer; }
.leaflet-grab { cursor: grab; }
.leaflet-dragging .leaflet-grab { cursor: move; }
.leaflet-marker-icon, .leaflet-marker-shadow, .leaflet-image-layer, .leaflet-pane > svg path, .leaflet-tile-container { pointer-events: none; }
.leaflet-marker-icon.leaflet-interactive, .leaflet-pane > svg path.leaflet-interactive { pointer-events: auto; }
.leaflet-popup { position: absolute; text-align: center; margin-bottom: 20px; }
.leaflet-popup-content-wrapper { padding: 1px; text-align: left; }
.leaflet-popup-content { margin: 10px 12px; min-height: 1px; }
.leaflet-popup-tip-container { width: 40px; height: 20px; position: absolute; left: 50%; margin-top: -1px; margin-left: -20px; overflow: hidden; pointer-events: none; }
.leaflet-popup-tip { width: 17px; height: 17px; padding: 1px; margin: -10px auto 0; pointer-events: auto; transform: rotate(45deg); }
.leaflet-tooltip { position: absolute; white-space: nowrap; pointer-events: none; -webkit-user-select: none; user-select: none; }
 
/* ---------- Карта и фильтры слоёв ---------- */
.tiles-dark { filter: invert(100%) hue-rotate(180deg) brightness(85%) contrast(95%); }
.tiles-sat { filter: brightness(72%) saturate(65%) contrast(105%); }
.leaflet-container.tool-draw, .leaflet-container.tool-draw .leaflet-interactive { cursor: crosshair; }
.leaflet-container.tool-flag { cursor: cell; }
 
#root { width: 100%; height: 100%; }
.app { position: relative; width: 100%; height: 100%; min-height: 320px; overflow: hidden; background: var(--bg); }
.map { position: absolute; inset: 0; width: 100%; height: 100%; }
 
/* ---------- Интерфейс ---------- */
.ui {
  position: absolute; inset: 0; z-index: 1000; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
.mid { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: flex-end; }
.bottom { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px; min-width: 0; }
.bottom-right { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.credit { align-self: flex-end; font-size: 10px; color: var(--muted); opacity: 0.8; letter-spacing: 0.04em; }
 
.panel {
  pointer-events: auto; max-width: 100%; min-width: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 2px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
 
button:focus-visible, input:focus-visible { outline: 2px solid var(--khaki); outline-offset: 2px; }
 
.tools { display: flex; flex-wrap: wrap; }
.tool, .seg, .btn, .zoom {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 12px; background: transparent; color: var(--muted);
  border: 0; cursor: pointer;
  font: 600 13px/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase;
}
.tool + .tool, .seg + .seg { border-left: 1px solid var(--line); }
.tool:hover, .seg:hover, .btn:hover:not(:disabled), .zoom:hover { color: var(--text); background: rgba(154, 158, 106, 0.08); }
.tool[aria-pressed="true"], .seg[aria-pressed="true"] { background: var(--olive); color: var(--text); box-shadow: inset 0 -2px 0 var(--khaki); }
.seg { padding: 8px 11px; font-size: 12px; }
.segs { display: inline-flex; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.btn { font-size: 12px; color: var(--text); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.danger { background: rgba(185, 28, 28, 0.28); box-shadow: inset 0 0 0 1px var(--red); }
.led { width: 8px; height: 8px; background: var(--gray); border: 1px solid var(--line); }
.btn[aria-pressed="true"] .led { background: var(--khaki); border-color: var(--khaki); }
.btn[aria-pressed="true"] { background: rgba(63, 68, 41, 0.55); }
.sim-panel { display: flex; flex-wrap: wrap; align-items: center; }
.sim-depth { display: flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 34px; border-left: 1px solid var(--line); }
.sim-stat { padding: 0 12px 0 0; font-size: 11px; color: var(--muted); }
.timeline { align-self: center; width: min(520px, 100%); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 4px 8px; }
.tl-day { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.tl-day b { font: 700 18px/1 var(--display); letter-spacing: 0.1em; color: var(--text); text-transform: uppercase; font-variant-numeric: tabular-nums; }
.tl-day small { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-ctrl { display: inline-flex; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.tl-ctrl .btn + .btn { border-left: 1px solid var(--line); }
.tl-play[aria-pressed="true"] { background: var(--olive); box-shadow: inset 0 -2px 0 var(--khaki); }
.tl-track { flex: 1 1 90px; display: flex; align-items: center; min-width: 60px; }
.timeline .btn { padding: 7px 9px; min-width: 34px; justify-content: center; }
.tl-track input[type="range"] { flex: 1; width: auto; min-width: 0; }
.tl-pause { flex-basis: 100%; font-size: 11px; color: var(--muted); }
.zoom-stack { display: flex; flex-direction: column; }
.zoom { justify-content: center; width: 38px; height: 38px; padding: 0; font-size: 18px; letter-spacing: 0; }
.zoom + .zoom { border-top: 1px solid var(--line); }
 
.opts { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; }
.opt-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.cap { font: 500 12px/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.val { min-width: 3.2em; font-variant-numeric: tabular-nums; color: var(--text); font-size: 12px; }
.hint { font-size: 11px; line-height: 1.4; color: var(--muted); max-width: 46ch; }
.sw { width: 18px; height: 18px; padding: 0; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 1px; cursor: pointer; }
.sw[aria-pressed="true"] { outline: 2px solid var(--text); outline-offset: 2px; }
 
input[type="range"] { -webkit-appearance: none; appearance: none; width: 120px; height: 16px; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--line); }
input[type="range"]::-moz-range-track { height: 2px; background: var(--line); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 14px; margin-top: -6px; background: var(--khaki); border: 0; border-radius: 0; }
input[type="range"]::-moz-range-thumb { width: 10px; height: 14px; background: var(--khaki); border: 0; border-radius: 0; }
 
.notice { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px 8px 12px; font-size: 11px; line-height: 1.45; color: var(--text); max-width: 46ch; }
.notice button { background: transparent; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
 
/* ---------- Флажки, подсказки, всплывающее окно ---------- */
.flag-icon { overflow: visible; }
.flag-icon svg { display: block; }
.flag-label {
  position: absolute; left: 27px; top: 3px; padding: 2px 6px;
  background: rgba(6, 7, 5, 0.9); border: 1px solid var(--line); border-radius: 2px;
  color: var(--text); font: 500 11px/1.2 var(--mono); white-space: nowrap; pointer-events: none;
}
.leaflet-tooltip.tac-tip {
  background: rgba(6, 7, 5, 0.92); border: 1px solid var(--line); border-radius: 2px;
  color: var(--text); font: 500 12px/1 var(--mono); padding: 5px 8px; font-variant-numeric: tabular-nums;
}
.tac-popup .leaflet-popup-content-wrapper {
  background: rgba(6, 7, 5, 0.94); color: var(--text); border: 1px solid var(--line); border-radius: 2px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
}
.tac-popup .leaflet-popup-tip { background: rgba(6, 7, 5, 0.94); border: 1px solid var(--line); box-shadow: none; }
.pop { display: flex; flex-direction: column; gap: 10px; width: 210px; }
.pop input[type="text"] {
  width: 100%; padding: 7px 8px; background: #121212; color: var(--text);
  border: 1px solid var(--line); border-radius: 2px; font: 400 12px var(--mono);
}
.pop input[type="text"]::placeholder { color: #5f6358; }
.pop-colors { display: flex; align-items: center; gap: 8px; }
.pop-actions { display: flex; justify-content: space-between; gap: 8px; }
.pop-actions button {
  padding: 7px 10px; background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 2px;
  font: 600 12px/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;
}
.pop-actions .primary { background: var(--olive); border-color: var(--khaki); }
.pop-actions .del { border-color: var(--red); }
 
@media (max-width: 520px) {
  .tool { padding: 9px 10px; gap: 6px; font-size: 12px; letter-spacing: 0.1em; }
  .tools { width: 100%; }
  .tool { flex: 1; justify-content: center; }
}
</style>

        tlRef.current.cur = 0;
        map.on('moveend zoomend resize', function () { zl.viewChanged(); });
      } catch (err) {
        console.error(err);
        mapRef.current = null;
        setMapError(String((err && err.message) || err));
      }
    }, []);
 
    useEffect(function () {
      var map = mapRef.current, b = basesRef.current;
      if (!map || !b[layer]) return;
      Object.keys(b).forEach(function (k) { if (map.hasLayer(b[k])) map.removeLayer(b[k]); });
      statRef.current = { ok: 0, err: 0 };
      b[layer].addTo(map);
    }, [layer]);
 
    /* ---------- инструменты ---------- */
    useEffect(function () {
      var map = mapRef.current;
      if (!map) return;
      var el = map.getContainer();
      var s = store.current;
      var drawing = tool === 'brush' || tool === 'zone';
      if (drawing) { map.dragging.disable(); map.boxZoom.disable(); }
      else { map.dragging.enable(); map.boxZoom.enable(); }
      el.classList.toggle('tool-draw', drawing || tool === 'ruler');
      el.classList.toggle('tool-flag', tool === 'flag');
 
      var act = null;
      var dotStyle = { radius: 3.5, color: '#0a0a0a', weight: 1, fillColor: '#e5e7eb', fillOpacity: 1, interactive: false, pane: 'shadowPane' };
 
      function cancelRuler() {
        if (s.ruler) { s.ruler.layers.forEach(function (l) { map.removeLayer(l); }); s.ruler = null; }
      }
      function updateRuler(r, b) {
        r.line.setLatLngs([r.a, b]);
        r.tip.setLatLng(L.latLng((r.a.lat + b.lat) / 2, (r.a.lng + b.lng) / 2)).setContent(fmtDist(map.distance(r.a, b)));
      }
      function newSeg(ll) {
        var layer = L.polyline([ll], { color: act.color, weight: act.width, opacity: 0.95, lineCap: 'round', lineJoin: 'round', interactive: false, pane: 'strokes' }).addTo(map);
        layer._day = act.day;
        var seg = { layer: layer, pts: [ll] };
        act.segs.push(seg);
        act.cur = seg;
        s.strokes.push(layer);
      }
 
      function onDown(e) {
        if (!drawing) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (e.target.closest && e.target.closest('.leaflet-marker-icon, .leaflet-popup')) return;
        var o = optsRef.current;
        var ll = map.mouseEventToLatLng(e);
        var px = map.mouseEventToContainerPoint(e);
        if (tool === 'brush') {
          if (!insideUA(ll)) return; /* кисть стартует только внутри границы */
          if (blockedByGray()) return;
          beginAction();
          try { el.setPointerCapture(e.pointerId); } catch (_) {}
          e.preventDefault();
          act = { kind: 'brush', color: COLORS[o.brushColor], width: o.brushWidth, segs: [], cur: null, last: px, cut: false, day: tlRef.current.cur + 1 };
          newSeg(ll);
        } else {
          if (blockedByGray()) return;
          try { el.setPointerCapture(e.pointerId); } catch (_) {}
          e.preventDefault();
          var pv = L.polyline([ll], { color: COLORS[o.zoneColor], weight: 2, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false, pane: 'strokes' }).addTo(map);
          act = { kind: 'zone', faction: o.zoneColor, preview: pv, pts: [ll], last: px };
        }
      }
      function onPMove(e) {
        if (!act) return;
        var px = map.mouseEventToContainerPoint(e);
        var ll = map.containerPointToLatLng(px);
        if (act.kind === 'brush') {
          if (!insideUA(ll)) { act.cut = true; return; } /* вне границы кисть не рисует */
          if (!act.cut && px.distanceTo(act.last) < 2) return;
          act.last = px;
          if (act.cut) { newSeg(ll); act.cut = false; }
          else { act.cur.pts.push(ll); act.cur.layer.addLatLng(ll); }
        } else {
          if (px.distanceTo(act.last) < 2) return;
          act.last = px;
          act.pts.push(ll);
          act.preview.addLatLng(ll);
        }
      }
      function finishFront(a) {
        map.removeLayer(a.preview);
        if (a.pts.length < 3) return; /* простой клик без протяжки */
        var cps = a.pts.map(function (p) { return map.latLngToContainerPoint(p); });
        var ll = L.LineUtil.simplify(cps, 0.8).map(function (p) { return map.containerPointToLatLng(p); });
        /* углы не скругляем: квадрат остаётся квадратом */
        var path = ll.map(function (p) { return [p.lng, p.lat]; });
        var feat = null;
        try { feat = buildFront(path); } catch (err) { console.error(err); }
        if (!feat) {
          showToast('Слишком короткая линия: обведите область контуром.');
          return;
        }
        beginAction();
        var seedPath = path.concat([path[0]]); /* замыкающая линия тоже запускает заливку */
        applyPolygon(feat, a.faction, seedPath);
        commitFrame({ kind: 'zone', feature: feat, faction: a.faction, path: seedPath });
      }
      function onUp(e) {
        if (!act) return;
        try { el.releasePointerCapture(e.pointerId); } catch (_) {}
        var a = act; act = null;
        if (a.kind === 'brush') {
          a.segs.forEach(function (sg) {
            if (sg.pts.length === 1) {
              map.removeLayer(sg.layer);
              s.strokes = s.strokes.filter(function (l) { return l !== sg.layer; });
              var dot = L.circleMarker(sg.pts[0], { radius: Math.max(a.width / 2, 1.5), stroke: false, fillColor: a.color, fillOpacity: 0.95, interactive: false, pane: 'strokes' }).addTo(map);
              dot._day = a.day;
              s.strokes.push(dot);
            } else if (sg.pts.length >= 3) {
              sg.layer.setLatLngs(chaikin(sg.pts, 1));
            }
          });
          commitFrame({ kind: 'brush' });
        } else {
          finishFront(a);
        }
      }
 
      function onClick(e) {
        var o = optsRef.current;
        if (tool === 'flag') {
          if (insideUA(e.latlng) && !blockedByGray()) {
            beginAction();
            addFlag(e.latlng, o.flagColor, '', true);
            commitFrame({ kind: 'flag' });
          }
          return;
        }
        if (tool !== 'ruler') return;
        if (!insideUA(e.latlng)) return;
        if (!s.ruler) {
          var a = e.latlng;
          var dotA = L.circleMarker(a, dotStyle).addTo(map);
          var line = L.polyline([a, a], { color: '#e5e7eb', weight: 1.5, opacity: 0.95, dashArray: '6 6', interactive: false, pane: 'shadowPane' }).addTo(map);
          var tip = L.tooltip({ permanent: true, direction: 'top', className: 'tac-tip', offset: [0, -6], opacity: 1, interactive: false })
            .setLatLng(a).setContent(fmtDist(0)).addTo(map);
          s.ruler = { a: a, line: line, tip: tip, layers: [dotA, line, tip] };
        } else {
          var r = s.ruler, b = e.latlng;
          updateRuler(r, b);
          var dotB = L.circleMarker(b, dotStyle).addTo(map);
          s.rulers.push({ layers: r.layers.concat([dotB]) });
          s.ruler = null;
          sync();
        }
      }
      function onMove(e) { if (tool === 'ruler' && s.ruler && insideUA(e.latlng)) updateRuler(s.ruler, e.latlng); }
      function onCtx() { if (tool === 'ruler') cancelRuler(); }
      function onKey(e) { if (e.key === 'Escape') cancelRuler(); }
 
      el.addEventListener('pointerdown', onDown);
      el.addEventListener('pointermove', onPMove);
      el.addEventListener('pointerup', onUp);
      el.addEventListener('pointercancel', onUp);
      map.on('click', onClick);
      map.on('mousemove', onMove);
      map.on('contextmenu', onCtx);
      window.addEventListener('keydown', onKey);
 
      return function () {
        el.removeEventListener('pointerdown', onDown);
        el.removeEventListener('pointermove', onPMove);
        el.removeEventListener('pointerup', onUp);
        el.removeEventListener('pointercancel', onUp);
        map.off('click', onClick);
        map.off('mousemove', onMove);
        map.off('contextmenu', onCtx);
        window.removeEventListener('keydown', onKey);
        if (act && act.preview) map.removeLayer(act.preview);
        cancelRuler();
      };
    }, [tool]);
 
    /* ---------- авто-линия боев: захват идёт с фиксированной скоростью, ползунок задаёт только глубину ---------- */
    useEffect(function () {
      if (zlRef.current) zlRef.current.configure(autoLine && depth > 0, depth);
    }, [autoLine, depth]);
 
    var simStatus = '';
    if (autoLine) {
      var shares = 'С ' + simInfo.blue + '% · К ' + simInfo.red + '%';
      if (depth === 0) simStatus = 'зона отключена';
      else if (!simInfo.att) simStatus = 'закрасьте красный или синий сектор';
      else if (simInfo.nofront) simStatus = 'нет стыка с противником';
      else simStatus = 'серая зона · ' + depth + ' км';
    }
    var hasStuff = count + (simInfo.edited ? 1 : 0) + (tlInfo.total > 1 ? 1 : 0) > 0;
 
    /* ---------- интерфейс ---------- */
    function swatches(list, cur, set) {
      return h('div', { className: 'flex items-center gap-2' },
        list.map(function (c) {
          return h('button', {
            key: c, type: 'button', className: 'sw', title: NAMES[c], 'aria-label': NAMES[c],
            'aria-pressed': cur === c, style: { background: COLORS[c] }, onClick: function () { set(c); }
          });
        }),
        h('span', { className: 'cap' }, NAMES[cur])
      );
    }
 
    var row = null;
    if (tool === 'brush') {
      row = h('div', { className: 'opt-row' },
        swatches(['blue', 'red'], brushColor, setBrushColor),
        h('div', { className: 'flex items-center gap-2' },
          h('label', { className: 'cap', htmlFor: 'brush-width' }, 'Толщина'),
          h('input', { id: 'brush-width', type: 'range', min: 2, max: 16, step: 1, value: brushWidth, onChange: function (e) { setBrushWidth(+e.target.value); } }),
          h('span', { className: 'val' }, brushWidth + ' px')
        )
      );
    } else if (tool === 'zone') {
      row = h('div', { className: 'opt-row' },
        swatches(['blue', 'red', 'gray'], zoneColor, setZoneColor)
      );
    } else if (tool === 'flag') {
      row = h('div', { className: 'opt-row' }, swatches(['blue', 'red', 'white'], flagColor, setFlagColor));
    }
 
    return h('div', { className: 'app' },
      h('div', { ref: elRef, className: 'map' }),
      h('div', { className: 'ui' },
        h('div', { className: 'top' },
          h('div', { className: 'panel tools', role: 'toolbar', 'aria-label': 'Инструменты' },
            TOOLS.map(function (t) {
              return h('button', { key: t.id, type: 'button', className: 'tool', 'aria-pressed': tool === t.id, onClick: function () { setTool(t.id); } },
                Ico(t.icon), h('span', null, t.label));
            })
          ),
          h('div', { className: 'panel opts' }, row, h('div', { className: 'hint' }, HINTS[tool])),
          mapError && h('div', { className: 'panel notice', role: 'alert' },
            h('span', null, 'Не удалось запустить карту: ' + mapError)
          ),
          toast && h('div', { className: 'panel notice', role: 'status' },
            h('span', null, toast),
            h('button', { type: 'button', 'aria-label': 'Закрыть', onClick: function () { setToast(''); } }, '×')
          ),
          notice && h('div', { className: 'panel notice', role: 'status' },
            h('span', null, 'Плитки Google не загрузились в этом окне, поэтому включена тактическая сетка. Откройте файл в обычном браузере, чтобы увидеть карту Google.'),
            h('button', { type: 'button', 'aria-label': 'Закрыть', onClick: function () { setNotice(false); } }, '×')
          )
        ),
        h('div', { className: 'mid' },
          h('div', { className: 'panel zoom-stack' },
            h('button', { type: 'button', className: 'zoom', 'aria-label': 'Приблизить', onClick: function () { if (mapRef.current) mapRef.current.zoomIn(); } }, '+'),
            h('button', { type: 'button', className: 'zoom', 'aria-label': 'Отдалить', onClick: function () { if (mapRef.current) mapRef.current.zoomOut(); } }, '−')
          )
        ),
        h('div', { className: 'panel timeline', role: 'group', 'aria-label': 'Хроника боевых действий' },
          h('div', { className: 'tl-day', 'aria-live': 'polite' },
            h('b', null, 'День ' + (tlInfo.cur + 1)),
            h('small', null, '/ ' + tlInfo.total)
          ),
          h('div', { className: 'tl-ctrl' },
            h('button', { type: 'button', className: 'btn', disabled: tlInfo.cur <= 0, title: 'День назад', 'aria-label': 'День назад', onClick: function () { stopPlay(); goTo(tlRef.current.cur - 1, false); } }, '◀'),
            h('button', { type: 'button', className: 'btn', disabled: tlInfo.cur >= tlInfo.total - 1, title: 'День вперёд', 'aria-label': 'День вперёд', onClick: function () { stopPlay(); goTo(tlRef.current.cur + 1, true); } }, '▶')
          ),
          h('button', { type: 'button', className: 'btn tl-play', 'aria-pressed': playing, title: playing ? 'Пауза' : 'Запустить хронику', 'aria-label': playing ? 'Пауза' : 'Запустить хронику', disabled: tlInfo.total < 2, onClick: function () { if (playing) stopPlay(); else startPlay(); } },
            playing ? '❚❚ Пауза' : '▶ Хроника'),
          h('div', { className: 'tl-track' },
            h('input', {
              type: 'range', min: 0, max: Math.max(0, tlInfo.total - 1), step: 1, value: tlInfo.cur, 'aria-label': 'День хроники',
              disabled: tlInfo.total < 2, style: { width: '100%' },
              onChange: function (e) { stopPlay(); goTo(+e.target.value, false); }
            }),
          ),
          autoLine && h('div', { className: 'tl-pause' }, 'Серая зона включена: запись новых дней приостановлена, рисование отключено.')
        ),
        h('div', { className: 'bottom' },
          h('div', { className: 'panel flex', role: 'group', 'aria-label': 'Слой карты' },
            LAYERS.map(function (l) {
              return h('button', { key: l[0], type: 'button', className: 'seg', 'aria-pressed': layer === l[0], onClick: function () { setLayer(l[0]); } }, l[1]);
            })
          ),
          h('div', { className: 'bottom-right' },
            h('div', { className: 'panel sim-panel' },
              h('button', { type: 'button', className: 'btn', 'aria-pressed': autoLine, onClick: function () { setAutoLine(!autoLine); } },
                h('span', { className: 'led' }), 'Серая зона: ' + (autoLine ? 'ВКЛ' : 'ВЫКЛ')),
              h('div', { className: 'sim-depth' },
                h('label', { className: 'cap', htmlFor: 'sim-depth' }, 'Глубина боев'),
                h('input', { id: 'sim-depth', type: 'range', min: 0, max: 15, step: 1, value: depth, onChange: function (e) { setDepth(+e.target.value); } }),
                h('span', { className: 'val' }, depth + ' км')
              ),
              autoLine && h('span', { className: 'sim-stat' }, simStatus)
            ),
            h('div', { className: 'panel' },
              h('button', { type: 'button', className: 'btn' + (confirmClear ? ' danger' : ''), disabled: !hasStuff && !confirmClear, onClick: onClear },
                confirmClear ? 'Подтвердить очистку' : 'Очистить все тактические элементы')
            )
          )
        ),
        layer !== 'grid' && h('div', { className: 'credit' }, 'Карта © Google')
      )
    );
  }
 
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body></html>
